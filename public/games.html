<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games &amp; Leaderboard — Mysterious</title>
<meta name="description" content="Play brain games like Memory Match, climb the leaderboard and earn XP on Mysterious.">
<link rel="canonical" href="https://mysteriouslearning.netlify.app/games.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mysterious">
<meta property="og:title" content="Games &amp; Leaderboard — Mysterious">
<meta property="og:description" content="Play brain games like Memory Match, climb the leaderboard and earn XP on Mysterious.">
<meta property="og:url" content="https://mysteriouslearning.netlify.app/games.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Games &amp; Leaderboard — Mysterious">
<meta name="twitter:description" content="Play brain games like Memory Match, climb the leaderboard and earn XP on Mysterious.">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
<header id="zehen-nav"></header>

<main>
  <section class="section">
    <div class="wrap">
      <h1>🎮 Games</h1>
      <p class="lead">Play, earn XP and climb the leaderboard. You need an account to save XP.</p>

      <div class="game-tabs" style="margin-top:1.4rem">
        <button class="chip-btn active" data-tab="memory">🃏 Memory Match</button>
        <button class="chip-btn" data-tab="theorist">🧠 Guess the Theorist</button>
        <button class="chip-btn" data-tab="category">🧩 Category Challenge</button>
        <button class="chip-btn" data-tab="board">🏆 Leaderboard</button>
      </div>

      <!-- MEMORY -->
      <div id="tab-memory">
        <div class="game-hud">
          <div class="hud-stat"><small>Moves</small><span id="mem-moves">0</span></div>
          <div class="hud-stat"><small>Pairs found</small><span id="mem-pairs">0 / 8</span></div>
          <div class="hud-stat"><small>Best score</small><span id="mem-best">—</span></div>
        </div>
        <div id="mem-msg" style="text-align:center;margin-bottom:1rem"></div>
        <div class="game-board" id="mem-board"></div>
        <div style="text-align:center;margin-top:1.4rem">
          <button class="btn btn-primary" id="mem-restart">↻ New game</button>
        </div>
      </div>

      <!-- THEORIST -->
      <div id="tab-theorist" style="display:none">
        <div class="card" style="max-width:42rem;margin:0 auto" id="theorist-box"></div>
      </div>

      <!-- CATEGORY CHALLENGE -->
      <div id="tab-category" style="display:none">
        <div class="card" style="max-width:44rem;margin:0 auto" id="cat-box"></div>
      </div>

      <!-- LEADERBOARD -->
      <div id="tab-board" style="display:none">
        <div id="board-box"></div>
      </div>
    </div>
  </section>
</main>

<footer id="zehen-footer"></footer>
<script src="js/nav.js"></script>
<script src="js/games.js"></script>
<script src="js/category-games.js"></script>
</body>
</html>
