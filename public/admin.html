<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Mysterious</title>
<meta name="description" content="Mysterious admin dashboard.">
<link rel="canonical" href="https://mysteriouslearning.netlify.app/admin.html">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mysterious">
<meta property="og:title" content="Admin — Mysterious">
<meta property="og:description" content="Mysterious admin dashboard.">
<meta property="og:url" content="https://mysteriouslearning.netlify.app/admin.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Admin — Mysterious">
<meta name="twitter:description" content="Mysterious admin dashboard.">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
<header id="zehen-nav"></header>

<main>
  <section class="section">
    <div class="wrap">
      <h1>👑 Admin panel</h1>
      <p class="lead">Manage Mysterious — users, content and community safety.</p>
      <div id="admin-gate" style="margin-top:1.4rem"></div>
      <div id="admin-ui" style="display:none">
        <div style="margin-top:1.2rem">
          <a class="btn btn-ghost" href="/api/admin/backup" download>💾 Download database backup</a>
        </div>
        <div class="admin-tabs" style="margin-top:1.4rem">
          <button class="chip-btn active" data-atab="dash">📊 Dashboard</button>
          <button class="chip-btn" data-atab="users">👥 Users</button>
          <button class="chip-btn" data-atab="notes">📚 Notes</button>
          <button class="chip-btn" data-atab="quizzes">🧩 Quizzes</button>
          <button class="chip-btn" data-atab="communities">🏠 Communities</button>
          <button class="chip-btn" data-atab="reports">⚠️ Reports <span id="rep-badge"></span></button>
        </div>
        <div id="atab-dash"></div>
        <div id="atab-users" style="display:none"></div>
        <div id="atab-notes" style="display:none"></div>
        <div id="atab-quizzes" style="display:none"></div>
        <div id="atab-communities" style="display:none"></div>
        <div id="atab-reports" style="display:none"></div>
      </div>
    </div>
  </section>
</main>
<div id="modal-root"></div>

<footer id="zehen-footer"></footer>
<script src="js/nav.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
